<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Document Base Gradient -->
    <linearGradient id="docGrad" x1="400" y1="100" x2="400" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    
    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="100" y1="500" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="150" y1="550" x2="650" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Document Shape -->
  <path d="M260 120 C260 100 276 84 296 84 H430 L550 204 V540 C550 560 534 576 514 576 H296 C276 576 260 560 260 540 V120 Z" fill="url(#docGrad)" filter="url(#dropShadow)"/>
  
  <!-- Document Fold -->
  <path d="M430 84 V168 C430 188 446 204 466 204 H550 L430 84 Z" fill="#3B82F6"/>

  <!-- Document Lines -->
  <rect x="330" y="260" width="160" height="24" rx="12" fill="white" opacity="0.95"/>
  <rect x="330" y="330" width="160" height="24" rx="12" fill="white" opacity="0.95"/>
  <rect x="330" y="400" width="100" height="24" rx="12" fill="#93C5FD"/>

  <!-- Back Wave -->
  <path d="M120 480 C200 400 350 480 400 480 C450 480 600 360 680 440 C680 440 700 620 400 620 C100 620 120 480 120 480 Z" fill="url(#wave2Grad)" filter="url(#dropShadow)"/>

  <!-- Front Wave -->
  <path d="M160 540 C220 460 330 550 400 550 C470 550 560 460 640 520 C640 520 620 680 400 680 C180 680 160 540 160 540 Z" fill="url(#wave1Grad)"/>
</svg>
